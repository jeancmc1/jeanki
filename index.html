<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 para navegadores web modernos -->
<html lang="es">
<!-- Inicio de la etiqueta raíz con idioma configurado en español -->

<head>
  <!-- Codificación de caracteres estándar UTF-8 para admitir acentos, eñes y caracteres especiales -->
  <meta charset="UTF-8" />
  <!-- Vista adaptable para garantizar que la página se vea perfecta en celulares y computadoras -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Título dinámico que se muestra en la pestaña superior del navegador web -->
  <title id="page-title">Mi Negocio & Catálogo Digital</title>

  <!-- Preconexión a los servidores de fuentes de Google para acelerar la carga de la tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Preconexión segura crossorigin para recursos externos -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Hoja de estilos de la fuente moderna 'Poppins' con grosores del 300 al 700 -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Inicio de la sección de estilos visuales CSS embebidos -->
  <style>
    /* Variables globales en :root para modificar colores y bordes dinámicamente desde JavaScript */
    :root {
      --bg-color: #f8fafc; /* Color de fondo general de la página web */
      --card-bg: #ffffff; /* Color de fondo de las tarjetas de productos y ventanas modales */
      --primary-color: #e11d48; /* Color primario para botones destacados y precios */
      --secondary-color: #be123c; /* Color secundario para estados hover o activos */
      --accent-color: #0f172a; /* Color oscuro utilizado en la barra superior */
      --text-color: #1e293b; /* Color principal de los textos y títulos */
      --text-muted: #64748b; /* Color gris atenuado para descripciones secundarias */
      --border-color: #e2e8f0; /* Color tenue para líneas divisorias y bordes */
      --radius: 14px; /* Radio de redondeo para las esquinas de tarjetas y botones */
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03); /* Sombra suave */
    }

    /* Regla universal para normalizar márgenes, rellenos y modelo de caja */
    * {
      box-sizing: border-box; /* Incluye bordes y rellenos en el cálculo del tamaño del elemento */
      margin: 0; /* Elimina márgenes exteriores por defecto */
      padding: 0; /* Elimina rellenos interiores por defecto */
      font-family: 'Poppins', sans-serif; /* Asigna la fuente Poppins globalmente */
    }

    /* Estilos del cuerpo principal de la página */
    body {
      background-color: var(--bg-color); /* Aplica el color de fondo dinámico */
      color: var(--text-color); /* Aplica el color de texto dinámico */
      min-height: 100vh; /* Asegura altura mínima equivalente a la pantalla completa */
      display: flex; /* Disposición flexible */
      flex-direction: column; /* Organiza los elementos en sentido vertical */
    }

    /* Barra superior informativa para tasa del BCV y medios de pago */
    .rate-bar {
      background: var(--accent-color); /* Fondo oscuro configurado */
      color: #ffffff; /* Letras blancas para contraste óptimo */
      font-size: 0.85rem; /* Tamaño de letra compacto y legible */
      padding: 8px 15px; /* Relleno superior e inferior */
      display: flex; /* Disposición en fila horizontal */
      justify-content: space-between; /* Un elemento a la izquierda y otro a la derecha */
      align-items: center; /* Alinea los elementos verticalmente al centro */
      flex-wrap: wrap; /* Pasa a la siguiente línea en pantallas muy estrechas */
      gap: 10px; /* Separación mínima entre elementos */
    }

    /* Insignia resaltada para mostrar la tasa del día */
    .rate-bar .badge {
      background: rgba(255, 255, 255, 0.2); /* Fondo blanco traslúcido */
      padding: 3px 8px; /* Relleno interior */
      border-radius: 6px; /* Bordes ligeramente curvados */
      font-weight: 600; /* Texto en negrita */
    }

    /* Contenedor del encabezado con imagen de banner JPG */
    .banner-container {
      position: relative; /* Base de posicionamiento para la capa superpuesta */
      height: 240px; /* Altura en píxeles del banner superior */
      background-color: #cbd5e1; /* Fondo grisáceo provisional mientras carga la imagen */
      background-size: cover; /* Escala la imagen cubriendo todo el ancho sin deformarse */
      background-position: center; /* Centra la imagen de fondo */
      display: flex; /* Disposición flexible */
      align-items: flex-end; /* Alinea los textos y logo en la base inferior */
      padding: 20px; /* Relleno perimetral */
    }

    /* Capa oscura con degradado superpuesta para asegurar legibilidad del texto */
    .banner-overlay {
      position: absolute; /* Superposición absoluta sobre el contenedor */
      inset: 0; /* Cubre los cuatro bordes (top, right, bottom, left en 0) */
      background: linear-gradient(to top, rgba(0,0,0,0.75) 20%, transparent 80%); /* Gradiente de oscuro a transparente */
    }

    /* Contenedor de la información del negocio (Logo, Nombre y Slogan) */
    .header-content {
      position: relative; /* Se coloca por encima de la capa overlay */
      z-index: 2; /* Nivel de capa superior para recibir clics y destacar */
      display: flex; /* Disposición horizontal */
      align-items: center; /* Centrado vertical entre logo y textos */
      gap: 18px; /* Separación entre el logo y los textos */
      width: 100%; /* Ocupa el ancho disponible */
      max-width: 1100px; /* Ancho máximo estándar centrado */
      margin: 0 auto; /* Centrado horizontal automático */
    }

    /* Imagen circular del logotipo de tu negocio o producto */
    .logo-img {
      width: 95px; /* Ancho del logo */
      height: 95px; /* Altura del logo */
      border-radius: 50%; /* Transforma la imagen en círculo */
      border: 4px solid #ffffff; /* Marco blanco alrededor para destacar */
      object-fit: cover; /* Evita que la foto se distorsione al recortarse */
      box-shadow: 0 4px 15px rgba(0,0,0,0.25); /* Sombra para dar volumen y relieve */
      background: #ffffff; /* Fondo blanco para logotipos con transparencia */
    }

    /* Nombre del negocio o producto en el encabezado */
    .business-info h1 {
      color: #ffffff; /* Letras blancas para contrastar con el fondo */
      font-size: 1.8rem; /* Tamaño de fuente grande */
      font-weight: 700; /* Negrita */
      line-height: 1.2; /* Altura de línea */
    }

    /* Slogan o descripción corta del negocio */
    .business-info p {
      color: #e2e8f0; /* Color gris suave */
      font-size: 0.95rem; /* Tamaño de texto mediano */
    }

    /* Barra de navegación para el botón del carrito */
    .nav-actions {
      max-width: 1100px; /* Ancho alineado con el contenido */
      margin: 15px auto; /* Centrado con margen vertical */
      padding: 0 20px; /* Relleno lateral */
      display: flex; /* Disposición horizontal */
      justify-content: flex-end; /* Alinea el botón del carrito a la derecha */
      align-items: center; /* Centrado vertical */
      width: 100%; /* Ancho completo */
    }

    /* Estilo base para todos los botones de la página */
    .btn {
      padding: 9px 18px; /* Espaciado interior ergonómico */
      border-radius: 9px; /* Esquinas redondeadas */
      font-size: 0.9rem; /* Tamaño de texto */
      font-weight: 600; /* Grosor seminegrita */
      border: none; /* Sin borde predeterminado */
      cursor: pointer; /* Cambia el cursor a mano para indicar clic */
      display: inline-flex; /* Disposición en línea flexible */
      align-items: center; /* Centrado vertical de íconos y texto */
      gap: 6px; /* Separación entre ícono y texto */
      transition: all 0.2s ease; /* Transición fluida para efectos visuales */
    }

    /* Botón de acción primaria */
    .btn-primary {
      background: var(--primary-color); /* Color primario configurado */
      color: #ffffff; /* Texto blanco */
    }

    /* Efecto al pasar el cursor sobre el botón primario */
    .btn-primary:hover {
      opacity: 0.92; /* Ligera opacidad al pasar el ratón */
    }

    /* Botón para abrir el carrito de compras */
    .btn-cart {
      background: #10b981; /* Verde esmeralda */
      color: #ffffff; /* Texto blanco */
      position: relative; /* Posición relativa para anclar la insignia de conteo */
    }

    /* Efecto al pasar el cursor sobre el botón del carrito */
    .btn-cart:hover {
      background: #059669; /* Verde oscuro al pasar el cursor */
    }

    /* Contador numérico de productos en el carrito */
    .badge-count {
      background: #ef4444; /* Rojo brillante */
      color: #ffffff; /* Texto blanco */
      font-size: 0.75rem; /* Letra pequeña */
      border-radius: 50%; /* Círculo completo */
      padding: 2px 7px; /* Relleno interior */
      margin-left: 5px; /* Separación del texto */
    }

    /* Contenedor central del contenido y catálogo */
    .container {
      max-width: 1100px; /* Ancho máximo estándar */
      margin: 0 auto 50px auto; /* Centrado automático y separación inferior */
      padding: 0 20px; /* Relleno a los lados */
      width: 100%; /* Ancho completo */
      flex-grow: 1; /* Ocupa el espacio vertical restante */
    }

    /* Barra horizontal desplazable para categorías */
    .category-filter {
      display: flex; /* Disposición en fila */
      gap: 8px; /* Espacio entre botones */
      overflow-x: auto; /* Permite scroll horizontal fluido en móviles */
      padding: 10px 0 20px 0; /* Relleno superior e inferior */
    }

    /* Botón individual de categoría */
    .cat-btn {
      background: var(--card-bg); /* Fondo de la tarjeta */
      border: 1px solid var(--border-color); /* Borde suave */
      padding: 7px 16px; /* Relleno */
      border-radius: 20px; /* Forma de píldora redondeada */
      font-size: 0.85rem; /* Tamaño de letra */
      font-weight: 500; /* Grosor medio */
      color: var(--text-color); /* Color de texto del tema */
      cursor: pointer; /* Cursor interactivo */
      white-space: nowrap; /* Evita que el nombre de la categoría se divida en dos líneas */
      transition: all 0.2s ease; /* Transición fluida */
    }

    /* Botón de la categoría activa actualmente seleccionada */
    .cat-btn.active {
      background: var(--primary-color); /* Fondo del color primario */
      color: #ffffff; /* Texto blanco */
      border-color: var(--primary-color); /* Borde a juego */
    }

    /* Cuadrícula responsiva de tarjetas de productos */
    .product-grid {
      display: grid; /* Grid CSS */
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); /* Columnas automáticas según el ancho de pantalla */
      gap: 22px; /* Separación entre tarjetas */
    }

    /* Tarjeta individual de producto */
    .product-card {
      background: var(--card-bg); /* Fondo dinámico */
      border-radius: var(--radius); /* Curvatura en esquinas */
      box-shadow: var(--shadow); /* Sombra sutil */
      border: 1px solid var(--border-color); /* Borde tenue */
      overflow: hidden; /* Recorta imágenes que sobrepasen el contenedor */
      display: flex; /* Disposición flexible */
      flex-direction: column; /* Apila imagen, texto y botón verticalmente */
      transition: transform 0.2s ease, box-shadow 0.2s ease; /* Animación al interactuar */
    }

    /* Efecto al pasar el cursor sobre la tarjeta */
    .product-card:hover {
      transform: translateY(-4px); /* Eleva la tarjeta 4 píxeles */
      box-shadow: 0 15px 30px -5px rgba(0,0,0,0.1); /* Intensifica la sombra */
    }

    /* Fotografía JPG del producto */
    .product-img {
      width: 100%; /* Ocupa el ancho completo */
      height: 190px; /* Altura estándar */
      object-fit: cover; /* Centra y recorta proporcionalmente sin deformar la foto */
      background: #e2e8f0; /* Fondo gris claro mientras carga */
    }

    /* Cuerpo interno de la tarjeta */
    .product-body {
      padding: 15px; /* Relleno perimetral */
      display: flex; /* Flexbox */
      flex-direction: column; /* Dirección en columna */
      flex-grow: 1; /* Permite que el botón inferior se alinee abajo parejo */
    }

    /* Nombre del producto */
    .product-title {
      font-size: 1.05rem; /* Tamaño de fuente */
      font-weight: 600; /* Negrita */
      margin-bottom: 6px; /* Separación */
    }

    /* Descripción detallada o especificaciones del producto */
    .product-desc {
      font-size: 0.85rem; /* Tamaño adecuado para lectura */
      color: var(--text-muted); /* Color suave */
      margin-bottom: 12px; /* Margen inferior */
      flex-grow: 1; /* Ocupa el espacio disponible para que los botones queden nivelados */
      line-height: 1.4; /* Interlineado */
    }

    /* Contenedor de precios */
    .product-pricing {
      margin-bottom: 12px; /* Margen inferior */
    }

    /* Precio principal en moneda de referencia ($ o €) */
    .price-ref {
      font-size: 1.25rem; /* Tamaño grande */
      font-weight: 700; /* Negrita */
      color: var(--primary-color); /* Color primario */
    }

    /* Precio convertido a Bolívares con tasa BCV */
    .price-bcv {
      font-size: 0.85rem; /* Tamaño compacto */
      color: var(--text-muted); /* Color atenuado */
      font-weight: 500; /* Grosor medio */
    }

    /* Fondo oscuro traslúcido para la ventana modal del carrito */
    .modal-overlay {
      position: fixed; /* Posición fija en la pantalla */
      inset: 0; /* Cubre los cuatro lados */
      background: rgba(0, 0, 0, 0.65); /* Color negro al 65% de opacidad */
      display: none; /* Oculto por defecto */
      align-items: center; /* Centrado vertical */
      justify-content: center; /* Centrado horizontal */
      z-index: 1000; /* Capa sobre todos los demás elementos */
      padding: 15px; /* Espacio para bordes en pantallas pequeñas */
    }

    /* Estado activo que despliega la ventana modal */
    .modal-overlay.active {
      display: flex; /* Pasa a ser visible como flexbox */
    }

    /* Caja contenedora del contenido del modal */
    .modal {
      background: #ffffff; /* Fondo blanco */
      border-radius: var(--radius); /* Curvatura */
      width: 100%; /* Ancho completo */
      max-width: 600px; /* Ancho máximo para mantener ergonomía */
      max-height: 90vh; /* Altura máxima del 90% de la ventana */
      overflow-y: auto; /* Habilita scroll vertical si el contenido sobrepasa la pantalla */
      box-shadow: 0 20px 40px rgba(0,0,0,0.25); /* Sombra pronunciada */
      display: flex; /* Flexbox */
      flex-direction: column; /* Apila encabezado y cuerpo */
    }

    /* Encabezado del modal */
    .modal-header {
      padding: 18px 22px; /* Relleno */
      border-bottom: 1px solid var(--border-color); /* Línea divisoria */
      display: flex; /* Disposición en fila */
      justify-content: space-between; /* Separa título a la izquierda y botón de cierre a la derecha */
      align-items: center; /* Centrado vertical */
    }

    /* Título del modal */
    .modal-header h3 {
      font-size: 1.25rem; /* Tamaño de fuente */
      font-weight: 600; /* Negrita */
    }

    /* Botón para cerrar modal (X) */
    .modal-close {
      background: none; /* Sin fondo */
      border: none; /* Sin borde */
      font-size: 1.6rem; /* Tamaño grande */
      cursor: pointer; /* Cursor de mano */
      color: var(--text-muted); /* Color gris */
      line-height: 1; /* Altura de línea ajustada */
    }

    /* Cuerpo del modal */
    .modal-body {
      padding: 22px; /* Relleno interno */
      display: flex; /* Flexbox */
      flex-direction: column; /* Apilado en vertical */
      gap: 16px; /* Separación entre bloques */
    }

    /* Grupos de formulario (Etiqueta + Campo) */
    .form-group {
      display: flex; /* Flexbox */
      flex-direction: column; /* Etiqueta arriba y campo abajo */
      gap: 6px; /* Separación */
    }

    /* Etiquetas de texto del formulario */
    .form-group label {
      font-size: 0.85rem; /* Tamaño */
      font-weight: 600; /* Negrita */
      color: var(--text-color); /* Color de texto del tema */
    }

    /* Campos de texto, selects y áreas de texto */
    .form-control {
      padding: 9px 12px; /* Relleno interno */
      border: 1px solid var(--border-color); /* Borde estándar */
      border-radius: 8px; /* Esquinas curvadas */
      font-size: 0.9rem; /* Tamaño */
      outline: none; /* Quita el marco azul predeterminado del navegador */
      background: #ffffff; /* Fondo blanco */
    }

    /* Resaltado cuando el usuario hace clic en el campo */
    .form-control:focus {
      border-color: var(--primary-color); /* Cambia el color del borde al primario */
    }

    /* Fila de formulario de dos columnas */
    .form-row {
      display: grid; /* Grid */
      grid-template-columns: 1fr 1fr; /* Dos columnas iguales */
      gap: 15px; /* Separación entre columnas */
    }

    /* Lista desplazable de artículos del carrito */
    .cart-items {
      display: flex; /* Flexbox */
      flex-direction: column; /* En columna */
      gap: 12px; /* Separación entre ítems */
      max-height: 250px; /* Altura máxima con scroll */
      overflow-y: auto; /* Scroll vertical */
    }

    /* Fila individual de cada artículo en el carrito */
    .cart-item {
      display: flex; /* Flexbox horizontal */
      align-items: center; /* Centrado vertical */
      justify-content: space-between; /* Información a la izquierda, botones de cantidad a la derecha */
      padding: 10px; /* Relleno */
      background: #f8fafc; /* Fondo gris claro */
      border-radius: 8px; /* Bordes curvados */
      border: 1px solid var(--border-color); /* Borde tenue */
    }

    /* Nombre del ítem en el carrito */
    .cart-item-title {
      font-weight: 600; /* Negrita */
      font-size: 0.9rem; /* Tamaño */
    }

    /* Detalle de cantidad y precios en el carrito */
    .cart-item-sub {
      font-size: 0.78rem; /* Letra pequeña */
      color: var(--text-muted); /* Color suave */
    }

    /* Controles de incremento y reducción de cantidades */
    .cart-qty-controls {
      display: flex; /* Disposición en fila */
      align-items: center; /* Centrado */
      gap: 8px; /* Espacio entre botones */
    }

    /* Botones pequeños de suma y resta */
    .btn-qty {
      background: #e2e8f0; /* Fondo gris */
      border: none; /* Sin borde */
      width: 28px; /* Ancho */
      height: 28px; /* Alto */
      border-radius: 6px; /* Curvatura */
      font-weight: bold; /* Negrita */
      cursor: pointer; /* Cursor de mano */
    }

    /* Cuadro de resumen final de totales */
    .cart-summary {
      background: #f1f5f9; /* Fondo suave */
      padding: 15px; /* Relleno interior */
      border-radius: 10px; /* Bordes curvados */
      display: flex; /* Flexbox */
      flex-direction: column; /* Apilado vertical */
      gap: 6px; /* Separación entre líneas */
    }

    /* Líneas individuales del resumen */
    .cart-summary-line {
      display: flex; /* Disposición en fila */
      justify-content: space-between; /* Título a la izquierda, total numérico a la derecha */
      font-size: 0.95rem; /* Tamaño */
    }

    /* Línea resaltada del total en Bolívares con tasa BCV */
    .cart-summary-line.total {
      font-size: 1.15rem; /* Tamaño mayor */
      font-weight: 700; /* Negrita */
      color: var(--primary-color); /* Color de acento primario */
      border-top: 1px solid #cbd5e1; /* Línea divisoria superior */
      padding-top: 8px; /* Separación respecto a la línea anterior */
      margin-top: 5px; /* Margen superior */
    }

    /* Botón flotante del carrito pensado para teléfonos celulares */
    .float-cart {
      position: fixed; /* Posición fija en pantalla */
      bottom: 20px; /* Separado del borde inferior */
      right: 20px; /* Separado del borde derecho */
      background: #10b981; /* Verde esmeralda */
      color: #ffffff; /* Texto blanco */
      padding: 14px 20px; /* Relleno generoso para pulsar con el dedo */
      border-radius: 50px; /* Forma de pastilla */
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.4); /* Sombra verde */
      display: none; /* Oculto por defecto en computadoras */
      align-items: center; /* Centrado */
      gap: 10px; /* Separación */
      font-weight: 700; /* Negrita */
      z-index: 900; /* Por encima de las tarjetas */
      cursor: pointer; /* Mano al pasar por encima */
    }

    /* Media query para pantallas con un ancho máximo de 600px (móviles) */
    @media (max-width: 600px) {
      .float-cart { display: flex; } /* Muestra el botón flotante en móviles */
      .banner-container { height: 200px; } /* Ajusta la altura del banner */
      .logo-img { width: 75px; height: 75px; } /* Reduce ligeramente el logo */
      .business-info h1 { font-size: 1.4rem; } /* Reduce el tamaño del título */
      .form-row { grid-template-columns: 1fr; } /* Pasa formularios de dos columnas a una sola columna */
    }
  </style>
  <!-- Fin de los estilos CSS -->
</head>

<body>
  <!-- ========================================================================= -->
  <!-- BARRA SUPERIOR INFORMATIVA: TASA BCV Y METODOS DE PAGO DISPONIBLES       -->
  <!-- ========================================================================= -->
  <div class="rate-bar">
    <div>
      <!-- Indicador con la bandera de Venezuela y el valor actual de la tasa del BCV -->
      <span>🇻🇪 <strong>Tasa Oficial EURO BCV:</strong> 1 <span id="rate-ref-label">EUR</span> = <span id="display-bcv-rate" class="badge">Bs. --</span></span>
    </div>
    <div>
      <!-- Medios de pago soportados según requerimiento -->
      <span>Medios de Pago: <strong>Efectivo $, Pago Móvil</strong></span>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- ENCABEZADO CON BANNER E IDENTIDAD DEL LOCAL (FOTOS JPG)                  -->
  <!-- ========================================================================= -->
  <header class="banner-container" id="banner-bg">
    <!-- Capa oscura superpuesta para asegurar legibilidad -->
    <div class="banner-overlay"></div>
    <!-- Contenedor con el logo y el nombre del negocio -->
    <div class="header-content">
      <!-- Imagen JPG del logo (se configura abajo en MI_CONFIGURACION.logo) -->
      <img id="logo-display" src="img/logo.jpg" alt="Logo Negocio" class="logo-img" onerror="this.src='https://via.placeholder.com/150?text=Logo'" />
      <div class="business-info">
        <!-- Nombre del local configurable en JavaScript -->
        <h1 id="business-name-display">Cookies 360</h1>
        <!-- Slogan o descripción corta configurable -->
        <p id="business-slogan-display">El mejor sabor en cada bocado</p>
      </div>
    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- BARRA DE ACCIONES: BOTON DE VER CARRITO                                   -->
  <!-- ========================================================================= -->
  <div class="nav-actions">
    <div>
      <!-- Botón para ver el carrito con conteo de productos agregados -->
      <button class="btn btn-cart" onclick="openCartModal()">
        🛒 Carrito <span id="cart-badge" class="badge-count">0</span>
      </button>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- CONTENEDOR PRINCIPAL DEL MENU Y PRODUCTOS                                 -->
  <!-- ========================================================================= -->
  <main class="container">
    <!-- Contenedor donde JavaScript inserta las categorías -->
    <div class="category-filter" id="categories-bar"></div>
    <!-- Cuadrícula donde JavaScript genera las tarjetas de cada producto -->
    <div class="product-grid" id="product-grid"></div>
  </main>

  <!-- ========================================================================= -->
  <!-- BOTON FLOTANTE PARA TELEFONOS CELULARES                                   -->
  <!-- ========================================================================= -->
  <div class="float-cart" onclick="openCartModal()">
    🛒 Ver Pedido (<span id="cart-float-count">0</span>)
  </div>

  <!-- ========================================================================= -->
  <!-- MODAL: VENTANA DEL CARRITO Y ENVIO DEL PEDIDO A WHATSAPP                  -->
  <!-- ========================================================================= -->
  <div class="modal-overlay" id="cart-modal">
    <div class="modal">
      <div class="modal-header">
        <!-- Título de la modal del carrito -->
        <h3>🛒 Tu Pedido</h3>
        <!-- Botón con la X para cerrar la modal -->
        <button class="modal-close" onclick="closeCartModal()">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Contenedor dinámico donde se listan los productos en el carrito -->
        <div class="cart-items" id="cart-items-container"></div>

        <!-- Resumen de subtotales y totales calculados -->
        <div class="cart-summary">
          <div class="cart-summary-line">
            <span>Total en Referencia:</span>
            <!-- Monto calculado en la moneda de referencia ($ o EUR) -->
            <span id="summary-total-ref">$0.00</span>
          </div>
          <div class="cart-summary-line total">
            <span>Total en Bolívares (Tasa BCV):</span>
            <!-- Monto total calculado en Bolívares usando la tasa del BCV -->
            <span id="summary-total-bs">Bs. 0,00</span>
          </div>
        </div>

        <!-- Formulario para recolectar datos de despacho y entrega -->
        <h4 style="font-size: 1rem; font-weight: 600; margin-top:5px;">Datos de Despacho y Pago</h4>

        <div class="form-row">
          <div class="form-group">
            <label>Nombre del Cliente *</label>
            <!-- Entrada para el nombre del cliente -->
            <input type="text" id="order-customer-name" class="form-control" placeholder="Ej. Carlos Mendoza" />
          </div>
          <div class="form-group">
            <label>Modalidad de Entrega</label>
            <!-- Selector para Delivery o Retiro en local -->
            <select id="order-delivery-type" class="form-control">
              <option value="Delivery">Delivery / Domicilio</option>
              <option value="Pick-up / Retiro">Retiro en el local</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Dirección / Punto de Referencia</label>
          <!-- Entrada para la dirección detallada -->
          <input type="text" id="order-customer-address" class="form-control" placeholder="Ej. Av. Principal, Urb. Los Chaguaramos" />
        </div>

        <div class="form-group">
          <label>Forma de Pago *</label>
          <!-- Selector con los 3 métodos de pago solicitados -->
          <select id="order-payment-method" class="form-control">
            <option value="Pago Móvil">📲 Pago Móvil (Tasa BCV)</option>
            <option value="Punto de Venta">💳 Punto de Venta (Tasa BCV)</option>
            <option value="Efectivo en Dólares ($)">💵 Efectivo en Dólares ($)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Observaciones (Opcional)</label>
          <!-- Campo para instrucciones específicas o información de billetes para cambio -->
          <input type="text" id="order-notes" class="form-control" placeholder="Ej. Empaque para regalo, billete de $20 para vuelto" />
        </div>

        <!-- Botón que genera el texto y abre WhatsApp con el pedido listo -->
        <button class="btn btn-primary" style="width: 100%; justify-content: center; font-size: 1rem; padding: 12px; background: #25D366;" onclick="sendOrderToWhatsApp()">
          📲 Enviar Pedido por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- SCRIPT DE JAVASCRIPT: CONFIGURACION Y LOGICA COMPLETA DE TU TIENDA        -->
  <!-- ========================================================================= -->
  <script>
    // =========================================================================
    // SECCION 1: CONFIGURACION GENERAL DE TU TIENDA (EDITA AQUI TUS DATOS)
    // Cambia los valores entre comillas según tus necesidades
    // =========================================================================
    const MI_CONFIGURACION = {
      // Nombre que aparecerá en el encabezado y en el título de la pestaña
      nombreNegocio: "Cookies 360",
      
      // Frase, lema o slogan que acompaña al nombre
      slogan: "El mejor sabor en cada bocado",
      
      // Símbolo de moneda que prefieras usar ("$" para dólares o "€" para euros)
      simboloMoneda: "$",
      
      // Ruta de tu logotipo en formato JPG (guarda tu archivo dentro de la carpeta img/)
      logoJPG: "img/logo.jpg",
      
      // Ruta de tu banner superior en formato JPG (guarda tu archivo dentro de la carpeta img/)
      bannerPNG: "img/Banner.png",
      
      // Tasa oficial del Banco Central de Venezuela (BCV) en Bolívares por cada 1 dólar/euro
      tasaBCV: 45.00,
      
      // Tu número de WhatsApp receptor con código de país SIN signos '+' ni espacios (ej: 584121234567)
      telefonoWhatsApp: "584120000000",
      
      // Datos bancarios que se incluirán en el mensaje si el cliente elige pagar con Pago Móvil
      datosPagoMovil: "Banco: Banesco | Teléfono: 0412-0000000 | C.I: V-12345678",
      
      // Paleta de colores de la página (puedes cambiar los códigos HEX)
      colores: {
        fondoPagina: "#f8fafc", // Color de fondo de toda la pantalla
        colorBotonesYPrecios: "#e11d48", // Color llamativo de botones y precios destacados
        fondoTarjetas: "#ffffff", // Color de fondo de las tarjetas de los productos
        colorTexto: "#1e293b" // Color oscuro para los textos y títulos
      }
    };

    // =========================================================================
    // SECCION 2: CATALOGO DE PRODUCTOS (EDITA, AGREGA O QUITA PRODUCTOS AQUI)
    // Para agregar un producto nuevo: copia un bloque {...}, pégalo y cámbiale los datos
    // =========================================================================
    const MIS_PRODUCTOS = [
      {
        id: "p1", // Identificador único (debe ser distinto para cada producto: p1, p2, p3...)
        name: "Galleta Choco Chips Clásica", // Nombre de tu producto
        category: "Clásicas", // Categoría a la que pertenece (sirve para los filtros)
        priceRef: 2.50, // Precio numérico en la moneda de referencia ($ o €)
        desc: "Galleta artesanal horneada con abundante chocolate semidulce y trozos crocantes.", // Descripción o ingredientes
        image: "img/producto1.jpg" // Ruta de la foto JPG dentro de la carpeta img/
      },
      {
        id: "p2",
        name: "Galleta Red Velvet Rellena",
        category: "Especiales",
        priceRef: 3.50,
        desc: "Suave masa roja sabor terciopelo rellena de cremoso queso crema y chispas blancas.",
        image: "img/producto2.jpg"
      },
      {
        id: "p3",
        name: "Caja Surtida 360 (6 Unidades)",
        category: "Combos",
        priceRef: 15.00,
        desc: "Selección especial con 6 de nuestras galletas más vendidas en caja de regalo.",
        image: "img/producto3.jpg"
      }
    ];

    // =========================================================================
    // SECCION 3: PLANTILLA DEL MENSAJE DE WHATSAPP (EDITA EL TEXTO DEL MENSAJE)
    // Aquí puedes cambiar cómo quieres que te llegue el pedido a tu WhatsApp
    // Usa \n para dar saltos de línea y asteriscos *texto* para poner negritas
    // =========================================================================
    function construirMensajeWhatsApp(datosPedido) {
      // Encabezado del mensaje
      let texto = `🍪 *NUEVO PEDIDO - ${MI_CONFIGURACION.nombreNegocio.toUpperCase()}*\n`;
      texto += `━━━━━━━━━━━━━━━━━━━━\n`;
      
      // Datos del cliente
      texto += `👤 *Cliente:* ${datosPedido.nombreCliente}\n`;
      texto += `📍 *Entrega:* ${datosPedido.tipoEntrega}\n`;
      
      // Si el cliente puso dirección, se añade
      if (datosPedido.direccion) {
        texto += `🏠 *Dirección:* ${datosPedido.direccion}\n`;
      }
      
      // Forma de pago seleccionada
      texto += `💳 *Método de Pago:* ${datosPedido.formaPago}\n`;
      
      // Observaciones o notas adicionales si las escribió
      if (datosPedido.notas) {
        texto += `📝 *Notas:* ${datosPedido.notas}\n`;
      }
      
      texto += `━━━━━━━━━━━━━━━━━━━━\n`;
      texto += `🛒 *DETALLE DEL PEDIDO:*\n`;

      // Lista de cada producto que pidió el cliente
      datosPedido.items.forEach(item => {
        texto += `• ${item.qty}x ${item.name} (${MI_CONFIGURACION.simboloMoneda}${item.subtotalRef.toFixed(2)} / Bs. ${item.subtotalBs})\n`;
      });

      texto += `━━━━━━━━━━━━━━━━━━━━\n`;
      // Totales calculados en moneda de referencia y en Bolívares
      texto += `💵 *TOTAL (${MI_CONFIGURACION.simboloMoneda}):* ${MI_CONFIGURACION.simboloMoneda}${datosPedido.totalRef.toFixed(2)}\n`;
      texto += `🇻🇪 *TOTAL EN BS (Tasa ${MI_CONFIGURACION.tasaBCV.toFixed(2)}):* Bs. ${datosPedido.totalBs}\n`;

      // Si el cliente eligió Pago Móvil, se anexan automáticamente los datos bancarios
      if (datosPedido.formaPago === "Pago Móvil" && MI_CONFIGURACION.datosPagoMovil) {
        texto += `\n📲 *Datos para realizar tu Pago Móvil:*\n${MI_CONFIGURACION.datosPagoMovil}\n`;
      }

      // Mensaje de despedida o agradecimiento al final
      texto += `\n¡Muchas gracias por tu pedido! Estaremos confirmando en breve. ✨`;

      return texto;
    }

    // =========================================================================
    // SECCION 4: LOGICA DEL CARRITO Y RENDERIZADO VISUAL
    // (Esta sección no necesitas modificarla, se encarga de que todo funcione)
    // =========================================================================

    // Arreglo en memoria para almacenar los artículos agregados al carrito
    let carrito = [];
    // Categoría activa actualmente seleccionada en los filtros
    let categoriaSeleccionada = "Todas";

    // Aplica las configuraciones de colores, nombres, banner y logotipo a la página
    function aplicarConfiguracionVisual() {
      // Inyecta los colores definidos en las variables CSS globales de :root
      document.documentElement.style.setProperty("--bg-color", MI_CONFIGURACION.colores.fondoPagina);
      document.documentElement.style.setProperty("--card-bg", MI_CONFIGURACION.colores.fondoTarjetas);
      document.documentElement.style.setProperty("--primary-color", MI_CONFIGURACION.colores.colorBotonesYPrecios);
      document.documentElement.style.setProperty("--text-color", MI_CONFIGURACION.colores.colorTexto);

      // Actualiza los textos del título de pestaña, nombre del negocio y slogan
      document.getElementById("page-title").textContent = MI_CONFIGURACION.nombreNegocio;
      document.getElementById("business-name-display").textContent = MI_CONFIGURACION.nombreNegocio;
      document.getElementById("business-slogan-display").textContent = MI_CONFIGURACION.slogan;

      // Asigna la foto JPG del logo
      document.getElementById("logo-display").src = MI_CONFIGURACION.logoJPG;

      // Asigna la foto JPG del banner superior
      document.getElementById("banner-bg").style.backgroundImage = `url('${MI_CONFIGURACION.bannerJPG}')`;

      // Actualiza la tasa del BCV en la barra superior
      document.getElementById("rate-ref-label").textContent = MI_CONFIGURACION.simboloMoneda;
      document.getElementById("display-bcv-rate").textContent = `Bs. ${Number(MI_CONFIGURACION.tasaBCV).toFixed(2)}`;
    }

    // Extrae y dibuja los botones de categorías disponibles
    function renderizarCategorias() {
      // Crea un conjunto sin duplicados que incluye 'Todas' y las categorías de los productos
      const categorias = ["Todas", ...new Set(MIS_PRODUCTOS.map(p => p.category || "General"))];
      const contenedor = document.getElementById("categories-bar");
      // Genera el HTML de los botones de cada categoría
      contenedor.innerHTML = categorias.map(cat => `
        <button class="cat-btn ${cat === categoriaSeleccionada ? 'active' : ''}" onclick="filtrarPorCategoria('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    // Filtra los productos según la categoría pulsada
    function filtrarPorCategoria(categoria) {
      categoriaSeleccionada = categoria; // Guarda la categoría elegida
      renderizarCategorias(); // Redibuja los botones para marcar el activo
      renderizarProductos(); // Filtra y dibuja los productos correspondientes
    }

    // Dibuja en pantalla las tarjetas de los productos del catálogo
    function renderizarProductos() {
      const cuadricula = document.getElementById("product-grid");
      // Filtra según la categoría seleccionada
      const productosFiltrados = categoriaSeleccionada === "Todas"
        ? MIS_PRODUCTOS
        : MIS_PRODUCTOS.filter(p => p.category === categoriaSeleccionada);

      // Si no hay productos en dicha categoría
      if (productosFiltrados.length === 0) {
        cuadricula.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:40px;">No hay productos en esta categoría.</p>`;
        return;
      }

      // Genera las tarjetas mostrando precio de referencia y su cálculo en Bolívares
      cuadricula.innerHTML = productosFiltrados.map(p => {
        // Multiplica el precio por la tasa del BCV
        const precioBs = (p.priceRef * MI_CONFIGURACION.tasaBCV).toFixed(2);
        return `
          <div class="product-card">
            <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x190?text=Foto+JPG'" />
            <div class="product-body">
              <h3 class="product-title">${p.name}</h3>
              <p class="product-desc">${p.desc || ''}</p>
              <div class="product-pricing">
                <div class="price-ref">${MI_CONFIGURACION.simboloMoneda} ${Number(p.priceRef).toFixed(2)}</div>
                <div class="price-bcv">Equivalente BCV: Bs. ${precioBs}</div>
              </div>
              <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="agregarAlCarrito('${p.id}')">
                ➕ Agregar al Carrito
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    // Agrega un producto al carrito de compras
    function agregarAlCarrito(productoId) {
      const itemExistente = carrito.find(item => item.id === productoId);
      if (itemExistente) {
        itemExistente.qty += 1; // Suma 1 a la cantidad existente
      } else {
        const producto = MIS_PRODUCTOS.find(p => p.id === productoId);
        if (producto) carrito.push({ ...producto, qty: 1 }); // Agrega con cantidad inicial de 1
      }
      actualizarContadorCarrito(); // Actualiza contadores visuales
    }

    // Modifica la cantidad de un producto dentro del carrito (+1 o -1)
    function cambiarCantidadCarrito(productoId, delta) {
      const item = carrito.find(i => i.id === productoId);
      if (!item) return;
      item.qty += delta; // Suma o resta
      if (item.qty <= 0) {
        // Si la cantidad llega a 0, se retira del carrito
        carrito = carrito.filter(i => i.id !== productoId);
      }
      actualizarContadorCarrito(); // Actualiza contadores
      renderizarModalCarrito(); // Redibuja la ventana del carrito
    }

    // Actualiza los badges numéricos del carrito
    function actualizarContadorCarrito() {
      const totalUnidades = carrito.reduce((acum, curr) => acum + curr.qty, 0);
      document.getElementById("cart-badge").textContent = totalUnidades;
      document.getElementById("cart-float-count").textContent = totalUnidades;
    }

    // Abre la ventana modal del carrito
    function openCartModal() {
      renderizarModalCarrito(); // Dibuja productos agregados
      document.getElementById("cart-modal").classList.add("active"); // Muestra la ventana
    }

    // Cierra la ventana modal del carrito
    function closeCartModal() {
      document.getElementById("cart-modal").classList.remove("active"); // Oculta la ventana
    }

    // Dibuja el listado de productos y los totales en el modal del carrito
    function renderizarModalCarrito() {
      const contenedor = document.getElementById("cart-items-container");

      // Si el carrito está vacío
      if (carrito.length === 0) {
        contenedor.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px;">Tu carrito está vacío.</p>`;
        document.getElementById("summary-total-ref").textContent = `${MI_CONFIGURACION.simboloMoneda}0.00`;
        document.getElementById("summary-total-bs").textContent = "Bs. 0,00";
        return;
      }

      let totalRef = 0; // Acumulador del costo de referencia

      // Dibuja cada producto con sus botones para sumar o restar
      contenedor.innerHTML = carrito.map(item => {
        const subtotalRef = item.priceRef * item.qty;
        totalRef += subtotalRef;
        const subtotalBs = (subtotalRef * MI_CONFIGURACION.tasaBCV).toFixed(2);
        return `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-sub">${item.qty} x ${MI_CONFIGURACION.simboloMoneda}${item.priceRef.toFixed(2)} = ${MI_CONFIGURACION.simboloMoneda}${subtotalRef.toFixed(2)} (Bs. ${subtotalBs})</div>
            </div>
            <div class="cart-qty-controls">
              <button class="btn-qty" onclick="cambiarCantidadCarrito('${item.id}', -1)">-</button>
              <span style="font-weight:600;">${item.qty}</span>
              <button class="btn-qty" onclick="cambiarCantidadCarrito('${item.id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      // Cálculo del monto total en Bolívares
      const totalBs = (totalRef * MI_CONFIGURACION.tasaBCV).toFixed(2);
      // Muestra los totales en pantalla
      document.getElementById("summary-total-ref").textContent = `${MI_CONFIGURACION.simboloMoneda}${totalRef.toFixed(2)}`;
      document.getElementById("summary-total-bs").textContent = `Bs. ${totalBs}`;
    }

    // Enviar el pedido estructurado hacia el WhatsApp del negocio
    function sendOrderToWhatsApp() {
      // Valida que existan productos en el carrito
      if (carrito.length === 0) {
        alert("El carrito está vacío. Agrega productos antes de enviar tu pedido.");
        return;
      }

      // Valida que el cliente coloque su nombre
      const nombreCliente = document.getElementById("order-customer-name").value.trim();
      if (!nombreCliente) {
        alert("Por favor escribe tu nombre para el pedido.");
        return;
      }

      // Recolección de los datos de despacho y pago
      const tipoEntrega = document.getElementById("order-delivery-type").value;
      const direccion = document.getElementById("order-customer-address").value.trim();
      const formaPago = document.getElementById("order-payment-method").value;
      const notas = document.getElementById("order-notes").value.trim();

      // Prepara los detalles de cada producto para la plantilla
      let totalRef = 0;
      const itemsProcesados = carrito.map(item => {
        const subtotal = item.priceRef * item.qty;
        totalRef += subtotal;
        const subtotalBs = (subtotal * MI_CONFIGURACION.tasaBCV).toFixed(2);
        return {
          name: item.name,
          qty: item.qty,
          subtotalRef: subtotal,
          subtotalBs: subtotalBs
        };
      });

      const totalBs = (totalRef * MI_CONFIGURACION.tasaBCV).toFixed(2);

      // Objeto con todos los datos del pedido
      const datosPedido = {
        nombreCliente,
        tipoEntrega,
        direccion,
        formaPago,
        notas,
        items: itemsProcesados,
        totalRef,
        totalBs
      };

      // Construye el mensaje personalizado llamando a la función de la SECCION 3
      const mensajeTexto = construirMensajeWhatsApp(datosPedido);

      // Limpia caracteres no numéricos del número configurado
      const telefonoLimpio = MI_CONFIGURACION.telefonoWhatsApp.replace(/\D/g, "");

      // Genera el enlace de la API de WhatsApp con el mensaje codificado
      const urlWhatsApp = `https://wa.me/${telefonoLimpio}?text=${encodeURIComponent(mensajeTexto)}`;

      // Abre la conversación de WhatsApp en una pestaña nueva
      window.open(urlWhatsApp, "_blank");
    }

    // =========================================================================
    // SECCION 5: INICIALIZACION AUTOMATICA AL CARGAR LA PAGINA
    // =========================================================================
    window.addEventListener("DOMContentLoaded", () => {
      aplicarConfiguracionVisual(); // Aplica colores, logo, banner y textos
      renderizarCategorias(); // Dibuja los botones de categorías
      renderizarProductos(); // Dibuja el catálogo de productos
      actualizarContadorCarrito(); // Inicializa el contador del carrito
    });
  </script>
</body>
</html>
