<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 para navegadores web modernos -->
<html lang="es">
<!-- Inicio de la etiqueta raíz con idioma configurado en español -->

<head>
  <!-- Codificación de caracteres estándar UTF-8 para admitir acentos, eñes y caracteres especiales -->
  <meta charset="UTF-8" />
  <!-- Vista adaptable para garantizar que la página se vea perfecta en celulares y computadoras -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Título dinámico que se muestra en la pestaña superior del navegador web -->
  <title id="page-title">Cookies 360 - Menú Digital</title>

  <!-- Preconexión a los servidores de fuentes de Google para acelerar la carga de la tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Preconexión segura crossorigin para recursos externos -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Hoja de estilos de la fuente moderna 'Poppins' con grosores del 300 al 800 -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Inicio de la sección de estilos visuales CSS embebidos -->
  <style>
    /* ========================================================================= */
    /* PALETA OFICIAL DE COLORES EXTRAIDA DE 'PALETA DE COLORES.PDF'             */
    /* ========================================================================= */
    :root {
      /* #FFF9F0: Fondo cálido crema vainilla extraído de la paleta oficial */
      --bg-color: #FFF9F0;
      /* #FFFFFF: Fondo blanco puro para hacer resaltar las fotos de las galletas */
      --card-bg: #FFFFFF;
      /* #EC3787: Rosa fucsia icónico del logo y banner de Cookies 360 */
      --primary-color: #EC3787;
      /* #FA6BAD: Tono rosa más claro para efectos hover al pasar el cursor */
      --secondary-color: #FA6BAD;
      /* #0049A6: Azul rey profundo corporativo para títulos, textos principales y botones */
      --text-color: #0049A6;
      /* #5173ED: Azul eléctrico de la paleta para categorías activas y acentos */
      --accent-blue: #5173ED;
      /* #5F89FF: Azul claro para hovers secundarios */
      --accent-blue-light: #5F89FF;
      /* #0049A6: Azul Rey Corporativo para el carrito (máximo contraste sobre fondo crema/pistacho) */
      --cart-btn-bg: #0049A6;
      /* #5173ED: Azul Eléctrico para el efecto hover al pasar el cursor */
      --cart-btn-hover: #5173ED;
      /* Sombra azul intensa para dar volumen y destacar el botón */
      --cart-btn-shadow: rgba(0, 73, 166, 0.35);
      /* #F6E2C2: Tono galleta / arena suave para bordes y separadores elegantes */
      --border-color: #F6E2C2;
      /* Azul oscuro traslúcido para textos secundarios */
      --text-muted: #43618f;
      /* Radio de curvatura redondeada para tarjetas y botones */
      --radius: 16px;
      /* Sombra suave con tinte azulado armonizado */
      --shadow: 0 10px 25px -5px rgba(0, 73, 166, 0.08), 0 8px 10px -6px rgba(0, 73, 166, 0.04);
    }

    /* Regla universal para normalizar márgenes, rellenos y modelo de caja */
    * {
      box-sizing: border-box; /* Incluye bordes y rellenos en el cálculo del tamaño del elemento */
      margin: 0; /* Elimina márgenes exteriores por defecto */
      padding: 0; /* Elimina rellenos interiores por defecto */
      font-family: 'Poppins', sans-serif; /* Asigna la fuente Poppins globalmente */
    }

    /* Estilos del cuerpo principal de la página */
    body {
      background-color: var(--bg-color); /* Aplica el color crema vainilla #FFF9F0 de respaldo */
      color: var(--text-color); /* Aplica el color azul corporativo #0049A6 */
      min-height: 100vh; /* Asegura altura mínima equivalente a la pantalla completa */
      display: flex; /* Disposición flexible */
      flex-direction: column; /* Organiza los elementos en sentido vertical */
      background-size: cover; /* Escala la imagen de fondo PNG cubriendo la pantalla */
      background-repeat: no-repeat; /* Evita que la imagen se corte o repita */
      background-position: center top; /* Centra la imagen desde la parte superior */
      background-attachment: fixed; /* Fondo fijo estilo paralaje al desplazarse */
    }

    /* Contenedor del encabezado con imagen de banner oficial */
    .banner-container {
      position: relative; /* Base de posicionamiento para la capa superpuesta */
      height: 270px; /* Altura en píxeles del banner superior */
      background-color: #0049A6; /* Fondo azul de respaldo mientras carga el banner */
      background-size: cover; /* Escala la imagen cubriendo todo el ancho sin deformarse */
      background-position: center; /* Centra la imagen de banner horizontal y verticalmente */
      display: flex; /* Disposición flexible */
      align-items: flex-end; /* Alinea los textos y logo en la base inferior */
      padding: 24px; /* Relleno perimetral */
      box-shadow: 0 4px 20px rgba(0, 73, 166, 0.15); /* Sombra inferior del banner */
    }

    /* Capa oscura superpuesta con gradiente azul rey para asegurar legibilidad */
    .banner-overlay {
      position: absolute; /* Superposición absoluta sobre el contenedor */
      inset: 0; /* Cubre los cuatro bordes (top, right, bottom, left en 0) */
      background: linear-gradient(to top, rgba(0, 73, 166, 0.85) 10%, rgba(0, 73, 166, 0.3) 55%, transparent 100%); /* Gradiente azul corporativo */
    }

    /* Contenedor de la información del negocio (Logo, Nombre y Slogan) */
    .header-content {
      position: relative; /* Se coloca por encima de la capa overlay */
      z-index: 2; /* Nivel de capa superior para recibir clics y destacar */
      display: flex; /* Disposición horizontal */
      align-items: center; /* Centrado vertical entre logo y textos */
      gap: 20px; /* Separación entre el logo y los textos */
      width: 100%; /* Ocupa el ancho disponible */
      max-width: 1100px; /* Ancho máximo estándar centrado */
      margin: 0 auto; /* Centrado horizontal automático */
    }

    /* Imagen circular del logotipo oficial de Cookies 360 */
    .logo-img {
      width: 130px; /* Ancho aumentado del logo para presencia destacada */
      height: 130px; /* Altura aumentada del logo */
      border-radius: 50%; /* Transforma la imagen en círculo */
      border: 4px solid #FFFFFF; /* Marco blanco brillante alrededor */
      object-fit: cover; /* Evita que la foto se distorsione al recortarse */
      box-shadow: 0 8px 24px rgba(0, 73, 166, 0.35); /* Sombra elegante con tinte azul */
      background: #FFFFFF; /* Fondo blanco */
    }

    /* Nombre del negocio en el encabezado */
    .business-info h1 {
      color: #FFFFFF; /* Letras blancas para contrastar nítidamente sobre el banner */
      font-size: 2.1rem; /* Tamaño de fuente grande */
      font-weight: 800; /* Grosor extra negrita */
      line-height: 1.15; /* Altura de línea ajustada */
      text-shadow: 0 2px 10px rgba(0, 73, 166, 0.5); /* Sombra de texto */
      letter-spacing: -0.5px; /* Espaciado tipográfico moderno */
    }

    /* Slogan o descripción corta del negocio */
    .business-info p {
      color: #FFF9F0; /* Tono crema claro para el subtítulo */
      font-size: 1.05rem; /* Tamaño de texto mediano */
      font-weight: 500; /* Grosor intermedio */
      text-shadow: 0 1px 6px rgba(0, 73, 166, 0.6); /* Sombra de texto */
    }

    /* Barra de navegación para el botón del carrito */
    .nav-actions {
      max-width: 1100px; /* Ancho alineado con el contenido */
      margin: 20px auto 10px auto; /* Centrado con margen vertical */
      padding: 0 20px; /* Relleno lateral */
      display: flex; /* Disposición horizontal */
      justify-content: flex-end; /* Alinea el botón del carrito a la derecha */
      align-items: center; /* Centrado vertical */
      width: 100%; /* Ancho completo */
    }

    /* Estilo base para todos los botones de la página */
    .btn {
      padding: 10px 22px; /* Espaciado interior ergonómico */
      border-radius: 12px; /* Esquinas redondeadas */
      font-size: 0.95rem; /* Tamaño de texto */
      font-weight: 600; /* Grosor seminegrita */
      border: none; /* Sin borde predeterminado */
      cursor: pointer; /* Cambia el cursor a mano para indicar clic */
      display: inline-flex; /* Disposición en línea flexible */
      align-items: center; /* Centrado vertical de íconos y texto */
      gap: 8px; /* Separación entre ícono y texto */
      transition: all 0.25s ease; /* Transición fluida para efectos visuales */
    }

    /* Botón de acción primaria: Rosa fucsia de la paleta #EC3787 */
    .btn-primary {
      background: var(--primary-color); /* Color fucsia Cookies 360 */
      color: #FFFFFF; /* Texto blanco */
      box-shadow: 0 4px 14px rgba(236, 55, 135, 0.35); /* Sombra luminosa fucsia */
    }

    /* Efecto al pasar el cursor sobre el botón fucsia */
    .btn-primary:hover {
      background: var(--secondary-color); /* Pasa al rosa más claro #FA6BAD */
      transform: translateY(-2px); /* Elevación sutil */
      box-shadow: 0 6px 18px rgba(236, 55, 135, 0.45); /* Sombra intensificada */
    }

    /* Botón para abrir el carrito de compras: Azul Rey Corporativo #0049A6 */
    .btn-cart {
      background: var(--cart-btn-bg); /* Azul rey oficial de la paleta para resaltar sobre el fondo */
      color: #FFFFFF; /* Texto blanco puro */
      position: relative; /* Posición relativa para anclar la insignia de conteo */
      box-shadow: 0 4px 16px var(--cart-btn-shadow); /* Sombra luminosa azul */
      border: 1.5px solid rgba(255, 255, 255, 0.4); /* Borde sutil brillante para despegar del fondo */
    }

    /* Efecto al pasar el cursor sobre el botón del carrito */
    .btn-cart:hover {
      background: var(--cart-btn-hover); /* Pasa al azul eléctrico #5173ED */
      transform: translateY(-2px); /* Elevación al pasar el ratón */
      box-shadow: 0 6px 20px rgba(0, 73, 166, 0.45); /* Sombra intensificada */
    }

    /* Contador numérico de productos en el carrito: Rosa #EC3787 */
    .badge-count {
      background: var(--primary-color); /* Fucsia resaltado */
      color: #FFFFFF; /* Número en blanco */
      font-size: 0.75rem; /* Letra pequeña */
      font-weight: 700; /* Negrita */
      border-radius: 50%; /* Círculo completo */
      padding: 2px 7px; /* Relleno interior */
      margin-left: 6px; /* Separación del texto */
      border: 1.5px solid #FFFFFF; /* Borde blanco fino */
    }

    /* Contenedor central del contenido y catálogo */
    .container {
      max-width: 1100px; /* Ancho máximo estándar */
      margin: 0 auto 50px auto; /* Centrado automático y separación inferior */
      padding: 0 20px; /* Relleno a los lados */
      width: 100%; /* Ancho completo */
      flex-grow: 1; /* Ocupa el espacio vertical restante */
    }

    /* Barra horizontal desplazable para categorías */
    .category-filter {
      display: flex; /* Disposición en fila */
      gap: 10px; /* Espacio entre botones */
      overflow-x: auto; /* Permite scroll horizontal fluido en móviles */
      padding: 10px 0 24px 0; /* Relleno superior e inferior */
    }

    /* Botón individual de categoría: Blanco con borde arena #F6E2C2 y texto azul #0049A6 */
    .cat-btn {
      background: var(--card-bg); /* Fondo blanco */
      border: 1.5px solid var(--border-color); /* Borde arena suave */
      padding: 8px 20px; /* Relleno interior */
      border-radius: 24px; /* Forma de píldora redondeada */
      font-size: 0.9rem; /* Tamaño de letra */
      font-weight: 600; /* Grosor seminegrita */
      color: var(--text-color); /* Texto azul #0049A6 */
      cursor: pointer; /* Cursor interactivo */
      white-space: nowrap; /* Evita que el nombre se corte en dos líneas */
      transition: all 0.25s ease; /* Transición fluida */
    }

    /* Efecto al pasar el cursor sobre la categoría inactiva */
    .cat-btn:hover {
      border-color: var(--accent-blue); /* Borde azul eléctrico */
      color: var(--accent-blue); /* Texto azul eléctrico */
      background: #FFFFFF; /* Fondo blanco */
    }

    /* Botón de la categoría activa: Azul Eléctrico #5173ED con texto blanco */
    .cat-btn.active {
      background: var(--accent-blue); /* Fondo azul eléctrico */
      color: #FFFFFF; /* Texto blanco */
      border-color: var(--accent-blue); /* Borde a juego */
      box-shadow: 0 4px 14px rgba(81, 115, 237, 0.35); /* Sombra luminosa azul */
    }

    /* Cuadrícula responsiva de tarjetas de productos */
    .product-grid {
      display: grid; /* Grid CSS */
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); /* Columnas automáticas responsivas */
      gap: 26px; /* Separación entre tarjetas */
    }

    /* Tarjeta individual de producto: Fondo blanco con borde arena #F6E2C2 */
    .product-card {
      background: var(--card-bg); /* Fondo blanco */
      border-radius: var(--radius); /* Curvatura en esquinas */
      box-shadow: var(--shadow); /* Sombra suave con tinte azul */
      border: 1.5px solid var(--border-color); /* Borde arena de la paleta */
      overflow: hidden; /* Recorta imágenes para redondear esquinas */
      display: flex; /* Disposición flexible */
      flex-direction: column; /* Apila imagen, texto y botón verticalmente */
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; /* Transición */
    }

    /* Efecto al pasar el cursor sobre la tarjeta */
    .product-card:hover {
      transform: translateY(-6px); /* Eleva la tarjeta 6 píxeles */
      box-shadow: 0 20px 35px -8px rgba(0, 73, 166, 0.16); /* Intensifica la sombra */
      border-color: var(--primary-color); /* El borde se ilumina en fucsia #EC3787 */
    }

    /* Fotografía del producto */
    .product-img {
      width: 100%; /* Ocupa el ancho completo */
      height: 230px; /* Altura estándar generosa para lucir las galletas */
      object-fit: cover; /* Centra y recorta proporcionalmente sin deformar la foto */
      background: #FFF9F0; /* Fondo crema mientras carga */
    }

    /* Cuerpo interno de la tarjeta */
    .product-body {
      padding: 20px; /* Relleno perimetral */
      display: flex; /* Flexbox */
      flex-direction: column; /* Dirección en columna */
      flex-grow: 1; /* Permite que el botón inferior se alinee parejo abajo */
    }

    /* Nombre del producto en Azul Corporativo #0049A6 */
    .product-title {
      font-size: 1.2rem; /* Tamaño de fuente prominente */
      font-weight: 700; /* Negrita */
      margin-bottom: 6px; /* Separación inferior */
      color: var(--text-color); /* Azul corporativo #0049A6 */
    }

    /* Descripción detallada de la galleta */
    .product-desc {
      font-size: 0.9rem; /* Tamaño de lectura cómodo */
      color: var(--text-muted); /* Color azul suave #43618f */
      margin-bottom: 16px; /* Margen inferior */
      flex-grow: 1; /* Ocupa el espacio disponible para nivelar botones */
      line-height: 1.45; /* Interlineado */
    }

    /* Etiqueta destacada en nueva línea para la recomendación Perfecta si... */
    .perfecta-si {
      display: block; /* Ubica la recomendación en una línea independiente */
      margin-top: 10px; /* Separación superior con el texto principal */
      font-size: 0.85rem; /* Tamaño de letra compacto y legible */
      color: var(--text-color); /* Color azul corporativo de la marca */
      background: rgba(81, 115, 237, 0.08); /* Fondo azul eléctrico muy suave */
      padding: 8px 12px; /* Relleno interior envolvente */
      border-radius: 8px; /* Bordes redondeados modernos */
      border-left: 3px solid var(--accent-blue); /* Franja lateral decorativa azul */
      line-height: 1.4; /* Interlineado cómodo para lectura */
    }

    /* Contenedor de opciones personalizables del producto (versiones y dips) */
    .product-options {
      margin: 12px 0 6px 0; /* Margen superior e inferior para separar de la descripción y precio */
      display: flex; /* Disposición flexible */
      flex-direction: column; /* Apila los grupos verticalmente */
      gap: 10px; /* Separación entre el grupo de versión y el de dip */
    }

    /* Grupo individual de opción (título y botones) */
    .option-group {
      display: flex; /* Disposición flexible */
      flex-direction: column; /* Dirección en columna */
      gap: 4px; /* Separación entre etiqueta y píldoras */
    }

    /* Etiqueta descriptiva del selector de opciones */
    .option-label {
      font-size: 0.8rem; /* Tamaño de fuente compacto */
      font-weight: 700; /* Texto en negrita para jerarquía visual */
      color: var(--text-color); /* Color azul corporativo */
      display: block; /* Ocupa su propia línea */
    }

    /* Contenedor envolvente de botones tipo píldora */
    .option-pills {
      display: flex; /* Disposición horizontal */
      flex-wrap: wrap; /* Pasa a la siguiente fila en pantallas pequeñas */
      gap: 6px; /* Separación entre botones */
    }

    /* Botón individual tipo píldora para seleccionar versión o dip */
    .pill-btn {
      padding: 6px 12px; /* Relleno táctil cómodo para celulares */
      border-radius: 20px; /* Forma de píldora redondeada */
      font-size: 0.78rem; /* Tamaño de letra compacto */
      font-weight: 600; /* Grosor seminegrita */
      border: 1.5px solid var(--border-color); /* Borde suave de la paleta */
      background: #FFFFFF; /* Fondo blanco */
      color: var(--text-color); /* Color azul corporativo */
      cursor: pointer; /* Cursor de mano interactivo */
      transition: all 0.2s ease; /* Transición visual suave */
    }

    /* Efecto al pasar el cursor sobre la píldora inactiva */
    .pill-btn:hover {
      border-color: var(--accent-blue); /* Borde azul eléctrico */
      color: var(--accent-blue); /* Texto azul eléctrico */
    }

    /* Estilo de la píldora activa seleccionada por el cliente */
    .pill-btn.active {
      background: var(--accent-blue); /* Fondo azul eléctrico de la paleta #5173ED */
      color: #FFFFFF; /* Texto blanco nítido */
      border-color: var(--accent-blue); /* Borde azul eléctrico a juego */
      box-shadow: 0 2px 8px rgba(81, 115, 237, 0.35); /* Sombra luminosa azul */
    }

    /* Contenedor de precios */
    .product-pricing {
      margin-bottom: 16px; /* Margen inferior */
      padding-top: 12px; /* Relleno superior */
      border-top: 1.5px dashed var(--border-color); /* Línea punteada decorativa arena */
    }

    /* Precio principal en moneda de referencia: Rosa Fucsia #EC3787 */
    .price-ref {
      font-size: 1.45rem; /* Tamaño grande y llamativo */
      font-weight: 800; /* Grosor extra negrita */
      color: var(--primary-color); /* Rosa fucsia de la paleta */
    }

    /* Precio convertido a Bolívares con tasa BCV: Azul #0049A6 */
    .price-bcv {
      font-size: 0.9rem; /* Tamaño compacto */
      color: var(--text-color); /* Azul corporativo */
      font-weight: 600; /* Grosor seminegrita */
      margin-top: 3px; /* Margen superior */
    }

    /* Fondo oscuro traslúcido para la ventana modal del carrito */
    .modal-overlay {
      position: fixed; /* Posición fija en la pantalla */
      inset: 0; /* Cubre los cuatro lados */
      background: rgba(0, 73, 166, 0.6); /* Azul corporativo con 60% de opacidad */
      display: none; /* Oculto por defecto */
      align-items: center; /* Centrado vertical */
      justify-content: center; /* Centrado horizontal */
      z-index: 1000; /* Capa sobre todos los demás elementos */
      padding: 15px; /* Espacio para bordes en pantallas pequeñas */
      backdrop-filter: blur(4px); /* Desenfoque de fondo moderno */
    }

    /* Estado activo que despliega la ventana modal */
    .modal-overlay.active {
      display: flex; /* Pasa a ser visible como flexbox */
    }

    /* Caja contenedora del contenido del modal */
    .modal {
      background: #FFFFFF; /* Fondo blanco */
      border-radius: var(--radius); /* Curvatura */
      width: 100%; /* Ancho completo */
      max-width: 620px; /* Ancho máximo para mantener ergonomía */
      max-height: 90vh; /* Altura máxima del 90% de la ventana */
      overflow-y: auto; /* Habilita scroll vertical si el contenido sobrepasa la pantalla */
      box-shadow: 0 24px 50px rgba(0, 73, 166, 0.25); /* Sombra envolvente */
      display: flex; /* Flexbox */
      flex-direction: column; /* Apila encabezado y cuerpo */
      border: 1.5px solid var(--border-color); /* Borde arena */
    }

    /* Encabezado del modal */
    .modal-header {
      padding: 20px 24px; /* Relleno */
      border-bottom: 1.5px solid var(--border-color); /* Línea divisoria arena */
      display: flex; /* Disposición en fila */
      justify-content: space-between; /* Separa título y botón de cierre */
      align-items: center; /* Centrado vertical */
      background: #FFF9F0; /* Fondo crema suave */
    }

    /* Título del modal en Azul Corporativo #0049A6 */
    .modal-header h3 {
      font-size: 1.3rem; /* Tamaño de fuente */
      font-weight: 700; /* Negrita */
      color: var(--text-color); /* Azul #0049A6 */
    }

    /* Botón para cerrar modal (X) */
    .modal-close {
      background: none; /* Sin fondo */
      border: none; /* Sin borde */
      font-size: 1.8rem; /* Tamaño grande */
      cursor: pointer; /* Cursor de mano */
      color: var(--text-color); /* Azul corporativo */
      line-height: 1; /* Altura de línea ajustada */
      transition: color 0.2s; /* Transición */
    }

    /* Efecto al pasar el cursor sobre la X */
    .modal-close:hover {
      color: var(--primary-color); /* Pasa a fucsia */
    }

    /* Cuerpo del modal */
    .modal-body {
      padding: 24px; /* Relleno interno */
      display: flex; /* Flexbox */
      flex-direction: column; /* Apilado en vertical */
      gap: 16px; /* Separación entre bloques */
    }

    /* Grupos de formulario (Etiqueta + Campo) */
    .form-group {
      display: flex; /* Flexbox */
      flex-direction: column; /* Etiqueta arriba y campo abajo */
      gap: 6px; /* Separación */
    }

    /* Etiquetas de texto del formulario */
    .form-group label {
      font-size: 0.88rem; /* Tamaño */
      font-weight: 600; /* Negrita */
      color: var(--text-color); /* Azul #0049A6 */
    }

    /* Campos de texto, selects y áreas de texto */
    .form-control {
      padding: 11px 14px; /* Relleno interno */
      border: 1.5px solid var(--border-color); /* Borde arena de la paleta */
      border-radius: 10px; /* Esquinas curvadas */
      font-size: 0.92rem; /* Tamaño */
      outline: none; /* Quita el marco azul predeterminado del navegador */
      background: #FFFFFF; /* Fondo blanco */
      color: var(--text-color); /* Texto azul */
      transition: border-color 0.2s, box-shadow 0.2s; /* Transición */
    }

    /* Resaltado cuando el usuario hace clic en el campo: Fucsia #EC3787 */
    .form-control:focus {
      border-color: var(--primary-color); /* Cambia el borde a fucsia */
      box-shadow: 0 0 0 3px rgba(236, 55, 135, 0.15); /* Resplandor fucsia suave */
    }

    /* Fila de formulario de dos columnas */
    .form-row {
      display: grid; /* Grid */
      grid-template-columns: 1fr 1fr; /* Dos columnas iguales */
      gap: 15px; /* Separación entre columnas */
    }

    /* Lista desplazable de artículos del carrito */
    .cart-items {
      display: flex; /* Flexbox */
      flex-direction: column; /* En columna */
      gap: 12px; /* Separación entre ítems */
      max-height: 250px; /* Altura máxima con scroll */
      overflow-y: auto; /* Scroll vertical */
    }

    /* Fila individual de cada artículo en el carrito */
    .cart-item {
      display: flex; /* Flexbox horizontal */
      align-items: center; /* Centrado vertical */
      justify-content: space-between; /* Información a la izquierda, botones a la derecha */
      padding: 12px; /* Relleno */
      background: #FFF9F0; /* Fondo crema de la paleta */
      border-radius: 10px; /* Bordes curvados */
      border: 1px solid var(--border-color); /* Borde arena */
    }

    /* Nombre del ítem en el carrito */
    .cart-item-title {
      font-weight: 700; /* Negrita */
      font-size: 0.95rem; /* Tamaño */
      color: var(--text-color); /* Azul #0049A6 */
    }

    /* Detalle de cantidad y precios en el carrito */
    .cart-item-sub {
      font-size: 0.82rem; /* Letra pequeña */
      color: var(--text-muted); /* Azul suave */
    }

    /* Controles de incremento y reducción de cantidades */
    .cart-qty-controls {
      display: flex; /* Disposición en fila */
      align-items: center; /* Centrado */
      gap: 8px; /* Espacio entre botones */
    }

    /* Botones pequeños de suma y resta: Tono arena #F6E2C2 con texto azul */
    .btn-qty {
      background: var(--border-color); /* Fondo arena #F6E2C2 */
      color: var(--text-color); /* Texto azul #0049A6 */
      border: none; /* Sin borde */
      width: 30px; /* Ancho */
      height: 30px; /* Alto */
      border-radius: 8px; /* Curvatura */
      font-weight: bold; /* Negrita */
      cursor: pointer; /* Cursor de mano */
      transition: background 0.2s; /* Transición */
    }

    /* Efecto al pasar el cursor sobre los botones de cantidad */
    .btn-qty:hover {
      background: var(--primary-color); /* Cambia a fucsia */
      color: #FFFFFF; /* Texto blanco */
    }

    /* Cuadro de resumen final de totales: Fondo crema con borde arena */
    .cart-summary {
      background: #FFF9F0; /* Fondo crema vainilla */
      padding: 16px 20px; /* Relleno interior */
      border-radius: 12px; /* Bordes curvados */
      display: flex; /* Flexbox */
      flex-direction: column; /* Apilado vertical */
      gap: 8px; /* Separación entre líneas */
      border: 1.5px solid var(--border-color); /* Borde arena */
    }

    /* Líneas individuales del resumen */
    .cart-summary-line {
      display: flex; /* Disposición en fila */
      justify-content: space-between; /* Título a la izquierda, total numérico a la derecha */
      font-size: 0.98rem; /* Tamaño */
      color: var(--text-color); /* Azul #0049A6 */
      font-weight: 500; /* Grosor medio */
    }

    /* Línea resaltada del total en Bolívares con tasa BCV */
    .cart-summary-line.total {
      font-size: 1.25rem; /* Tamaño mayor */
      font-weight: 800; /* Extra negrita */
      color: var(--primary-color); /* Fucsia Cookies 360 #EC3787 */
      border-top: 1.5px dashed var(--border-color); /* Línea punteada superior */
      padding-top: 10px; /* Separación superior */
      margin-top: 6px; /* Margen superior */
    }

    /* Botón flotante del carrito pensado para teléfonos celulares: Azul Rey Corporativo #0049A6 */
    .float-cart {
      position: fixed; /* Posición fija en pantalla */
      bottom: 20px; /* Separado del borde inferior */
      right: 20px; /* Separado del borde derecho */
      background: var(--cart-btn-bg); /* Azul rey oficial para destacar sobre el fondo crema/pistacho */
      color: #FFFFFF; /* Texto blanco */
      padding: 14px 24px; /* Relleno generoso para pulsar con el dedo */
      border-radius: 50px; /* Forma de pastilla */
      box-shadow: 0 10px 25px var(--cart-btn-shadow); /* Sombra profunda azul */
      border: 2px solid #FFFFFF; /* Borde blanco brillante para despegar de cualquier fondo */
      display: none; /* Oculto por defecto en computadoras */
      align-items: center; /* Centrado */
      gap: 10px; /* Separación */
      font-weight: 700; /* Negrita */
      z-index: 900; /* Por encima de las tarjetas */
      cursor: pointer; /* Mano al pasar por encima */
      transition: all 0.25s ease; /* Transición fluida */
    }

    /* Efecto al pasar el cursor o pulsar sobre el botón flotante */
    .float-cart:hover {
      background: var(--cart-btn-hover); /* Pasa al azul eléctrico */
      transform: translateY(-3px); /* Elevación sutil */
      box-shadow: 0 14px 30px rgba(0, 73, 166, 0.5); /* Sombra intensificada */
    }

    /* Media query para pantallas con un ancho máximo de 600px (móviles) */
    @media (max-width: 600px) {
      .float-cart { display: flex; } /* Muestra el botón flotante en móviles */
      .banner-container { height: 220px; } /* Ajusta la altura del banner en móviles */
      .logo-img { width: 95px; height: 95px; } /* Ajusta proporcionalmente el logo en móviles */
      .business-info h1 { font-size: 1.6rem; } /* Reduce el tamaño del título */
      .form-row { grid-template-columns: 1fr; } /* Pasa formularios de dos columnas a una sola columna */
    }
  </style>
  <!-- Fin de los estilos CSS -->
</head>

          // Sabores de dips disponibles para elegir (puedes cambiarlos o agregar más aquí)
          dips: ["Chocolate clásico", "Chocolate blanco", "Arequipe", "Mixto"]
        }
      }
    ];

    // =========================================================================
    // SECCION 3: PLANTILLA DEL MENSAJE DE WHATSAPP (EDITA EL TEXTO DEL MENSAJE)
    // Aquí puedes cambiar cómo quieres que te llegue el pedido a tu WhatsApp
    // Usa \n para dar saltos de línea y asteriscos *texto* para poner negritas
    // =========================================================================
    function construirMensajeWhatsApp(datosPedido) {
      // Encabezado del mensaje
      let texto = `🍪 *NUEVO PEDIDO - ${MI_CONFIGURACION.nombreNegocio.toUpperCase()}*\n`;
      texto += `━━━━━━━━━━━━━━━━━━━━\n`;
      
      // Datos del cliente
      texto += `👤 *Cliente:* ${datosPedido.nombreCliente}\n`;
      texto += `📍 *Entrega:* ${datosPedido.tipoEntrega}\n`;
      
      // Si el cliente puso dirección, se añade
      if (datosPedido.direccion) {
        texto += `🏠 *Dirección:* ${datosPedido.direccion}\n`;
      }
      
      // Forma de pago seleccionada
      texto += `💳 *Método de Pago:* ${datosPedido.formaPago}\n`;
      
      // Observaciones o notas adicionales si las escribió
      if (datosPedido.notas) {
        texto += `📝 *Notas:* ${datosPedido.notas}\n`;
      }
      
      texto += `━━━━━━━━━━━━━━━━━━━━\n`;
      texto += `🛒 *DETALLE DEL PEDIDO:*\n`;

      // Lista de cada producto que pidió el cliente
      datosPedido.items.forEach(item => {
        texto += `• ${item.qty}x ${item.name} (${MI_CONFIGURACION.simboloMoneda}${item.subtotalRef.toFixed(2)} / Bs. ${item.subtotalBs})\n`;
      });

      texto += `━━━━━━━━━━━━━━━━━━━━\n`;
      // Totales calculados en moneda de referencia y en Bolívares según tasa Euro BCV
      texto += `💵 *TOTAL (${MI_CONFIGURACION.simboloMoneda}):* ${MI_CONFIGURACION.simboloMoneda}${datosPedido.totalRef.toFixed(2)}\n`;
      texto += `💶 *TOTAL EN BS (Tasa Euro BCV ${MI_CONFIGURACION.tasaBCV.toFixed(2)}):* Bs. ${datosPedido.totalBs}\n`;

      // Si el cliente eligió Pago Móvil, se anexan automáticamente los datos bancarios
      if (datosPedido.formaPago === "Pago Móvil" && MI_CONFIGURACION.datosPagoMovil) {
        texto += `\n📲 *Datos para realizar tu Pago Móvil:*\n${MI_CONFIGURACION.datosPagoMovil}\n`;
      }

      // Mensaje de despedida o agradecimiento al final
      texto += `\n¡Muchas gracias por tu pedido a Cookies 360! Estaremos confirmando en breve. ✨`;

      return texto;
    }

    // =========================================================================
    // SECCION 4: LOGICA DEL CARRITO Y RENDERIZADO VISUAL
    // (Esta sección no necesitas modificarla, se encarga de que todo funcione)
    // =========================================================================

    // Arreglo en memoria para almacenar los artículos agregados al carrito
    let carrito = [];
    // Categoría activa actualmente seleccionada en los filtros
    let categoriaSeleccionada = "Todas";

    // Aplica las configuraciones de colores, nombres, banner y logotipo a la página
    function aplicarConfiguracionVisual() {
      // Inyecta los colores definidos en las variables CSS globales de :root
      document.documentElement.style.setProperty("--bg-color", MI_CONFIGURACION.colores.fondoPagina);
      document.documentElement.style.setProperty("--card-bg", MI_CONFIGURACION.colores.fondoTarjetas);
      document.documentElement.style.setProperty("--primary-color", MI_CONFIGURACION.colores.colorBotonesYPrecios);
      document.documentElement.style.setProperty("--secondary-color", MI_CONFIGURACION.colores.colorHoverFucsia);
      document.documentElement.style.setProperty("--text-color", MI_CONFIGURACION.colores.colorTexto);
      document.documentElement.style.setProperty("--accent-blue", MI_CONFIGURACION.colores.colorAcentoAzul);
      document.documentElement.style.setProperty("--green-pistachio", MI_CONFIGURACION.colores.colorVerdePistacho);
      document.documentElement.style.setProperty("--border-color", MI_CONFIGURACION.colores.colorBordesArena);

      // Actualiza los textos del título de pestaña, nombre del negocio y slogan
      document.getElementById("page-title").textContent = MI_CONFIGURACION.nombreNegocio + " - Menú Digital";
      document.getElementById("business-name-display").textContent = MI_CONFIGURACION.nombreNegocio;
      document.getElementById("business-slogan-display").textContent = MI_CONFIGURACION.slogan;

      // Asigna la foto del logo
      document.getElementById("logo-display").src = MI_CONFIGURACION.logoJPG;

      // Asigna la foto del banner superior
      document.getElementById("banner-bg").style.backgroundImage = `url('${MI_CONFIGURACION.bannerJPG}')`;

      // Aplica la imagen PNG de fondo a la página principal si está configurada
      if (MI_CONFIGURACION.fondoPaginaPNG && MI_CONFIGURACION.fondoPaginaPNG.trim() !== "") {
        document.body.style.backgroundImage = `url('${MI_CONFIGURACION.fondoPaginaPNG}')`;
      }
    }

    // Extrae y dibuja los botones de categorías disponibles
    function renderizarCategorias() {
      // Crea un conjunto sin duplicados que incluye 'Todas' y las categorías de los productos
      const categorias = ["Todas", ...new Set(MIS_PRODUCTOS.map(p => p.category || "General"))];
      const contenedor = document.getElementById("categories-bar");
      // Genera el HTML de los botones de cada categoría
      contenedor.innerHTML = categorias.map(cat => `
        <button class="cat-btn ${cat === categoriaSeleccionada ? 'active' : ''}" onclick="filtrarPorCategoria('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    // Filtra los productos según la categoría pulsada
    function filtrarPorCategoria(categoria) {
      categoriaSeleccionada = categoria; // Guarda la categoría elegida
      renderizarCategorias(); // Redibuja los botones para marcar el activo
      renderizarProductos(); // Filtra y dibuja los productos correspondientes
    }

    // Objeto para registrar la versión y el dip seleccionado en productos con opciones
    const opcionesSeleccionadas = {};

    // Permite al cliente seleccionar una versión o dip directamente en la tarjeta del producto
    function seleccionarOpcion(productoId, tipo, valor, elementoBoton) {
      // Inicializa el registro de opciones del producto si aún no existe
      if (!opcionesSeleccionadas[productoId]) {
        opcionesSeleccionadas[productoId] = {};
      }
      // Guarda la selección efectuada por el usuario ('version' o 'dip')
      opcionesSeleccionadas[productoId][tipo] = valor;

      // Actualiza la clase activa en el grupo de botones
      const contenedor = elementoBoton.parentElement;
      const botones = contenedor.querySelectorAll(".pill-btn");
      botones.forEach(btn => btn.classList.remove("active"));
      elementoBoton.classList.add("active");
    }

    // Dibuja en pantalla las tarjetas de los productos del catálogo
    function renderizarProductos() {
      const cuadricula = document.getElementById("product-grid");
      // Filtra según la categoría seleccionada
      const productosFiltrados = categoriaSeleccionada === "Todas"
        ? MIS_PRODUCTOS
        : MIS_PRODUCTOS.filter(p => p.category === categoriaSeleccionada);

      // Si no hay productos en dicha categoría
      if (productosFiltrados.length === 0) {
        cuadricula.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:40px;">No hay productos en esta categoría.</p>`;
        return;
      }

      // Genera las tarjetas mostrando precio de referencia y su cálculo en Bolívares
      cuadricula.innerHTML = productosFiltrados.map(p => {
        // Multiplica el precio por la tasa del BCV
        const precioBs = (p.priceRef * MI_CONFIGURACION.tasaBCV).toFixed(2);

        // Genera el bloque de selección si el producto tiene opciones configuradas (ej: Mini giro)
        let htmlOpciones = "";
        if (p.options) {
          const verActiva = (opcionesSeleccionadas[p.id] && opcionesSeleccionadas[p.id].version) || p.options.versiones[0];
          const dipActivo = (opcionesSeleccionadas[p.id] && opcionesSeleccionadas[p.id].dip) || p.options.dips[0];
          htmlOpciones = `
            <div class="product-options">
              <div class="option-group">
                <span class="option-label">1. Elige tu versión:</span>
                <div class="option-pills">
                  ${p.options.versiones.map(v => `
                    <button type="button" class="pill-btn ${v === verActiva ? 'active' : ''}" onclick="seleccionarOpcion('${p.id}', 'version', '${v}', this)">
                      ${v}
                    </button>
                  `).join("")}
                </div>
              </div>
              <div class="option-group">
                <span class="option-label">2. Elige tu dip incluido:</span>
                <div class="option-pills">
                  ${p.options.dips.map(d => `
                    <button type="button" class="pill-btn ${d === dipActivo ? 'active' : ''}" onclick="seleccionarOpcion('${p.id}', 'dip', '${d}', this)">
                      ${d}
                    </button>
                  `).join("")}
                </div>
              </div>
            </div>
          `;
        }

        return `
          <div class="product-card">
            <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x230?text=Foto+JPG'" />
            <div class="product-body">
              <h3 class="product-title">${p.name}</h3>
              <p class="product-desc">${p.desc || ''}</p>
              ${htmlOpciones}
              <div class="product-pricing">
                <div class="price-ref">${MI_CONFIGURACION.simboloMoneda} ${Number(p.priceRef).toFixed(2)}</div>
                <div class="price-bcv">Equivalente Euro BCV: Bs. ${precioBs}</div>
              </div>
              <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="agregarAlCarrito('${p.id}')">
                ➕ Agregar al Carrito
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    // Agrega un producto al carrito de compras considerando su versión y dip
    function agregarAlCarrito(productoId) {
      const producto = MIS_PRODUCTOS.find(p => p.id === productoId);
      if (!producto) return;

      let nombreItem = producto.name;
      let idCarrito = producto.id;

      // Si el producto cuenta con opciones personalizables
      if (producto.options) {
        // Obtiene la versión seleccionada o toma la primera por defecto
        const verElegida = (opcionesSeleccionadas[productoId] && opcionesSeleccionadas[productoId].version) || producto.options.versiones[0];
        // Obtiene el dip seleccionado o toma el primero por defecto
        const dipElegido = (opcionesSeleccionadas[productoId] && opcionesSeleccionadas[productoId].dip) || producto.options.dips[0];
        // Personaliza el nombre visible para el carrito y WhatsApp
        nombreItem = `${producto.name} (${verElegida} - Dip: ${dipElegido})`;
        // Crea un identificador único para registrar diferentes variantes de forma separada
        idCarrito = `${producto.id}_${verElegida}_${dipElegido}`;
      }

      // Busca si esta variante específica ya se encuentra en el carrito
      const itemExistente = carrito.find(item => (item.cartId || item.id) === idCarrito);
      if (itemExistente) {
        itemExistente.qty += 1; // Suma 1 a la cantidad existente
      } else {
        carrito.push({
          ...producto,
          cartId: idCarrito, // Identificador único de la variante
          name: nombreItem, // Nombre con versión y dip
          qty: 1 // Cantidad inicial
        });
      }
      actualizarContadorCarrito(); // Actualiza contadores visuales
    }

    // Modifica la cantidad de un producto o variante dentro del carrito (+1 o -1)
    function cambiarCantidadCarrito(idItem, delta) {
      const item = carrito.find(i => (i.cartId || i.id) === idItem);
      if (!item) return;
      item.qty += delta; // Suma o resta
      if (item.qty <= 0) {
        // Si la cantidad llega a 0, se retira del carrito
        carrito = carrito.filter(i => (i.cartId || i.id) !== idItem);
      }
      actualizarContadorCarrito(); // Actualiza contadores
      renderizarModalCarrito(); // Redibuja la ventana del carrito
    }

    // Actualiza los badges numéricos del carrito
    function actualizarContadorCarrito() {
      const totalUnidades = carrito.reduce((acum, curr) => acum + curr.qty, 0);
      document.getElementById("cart-badge").textContent = totalUnidades;
      document.getElementById("cart-float-count").textContent = totalUnidades;
    }

    // Abre la ventana modal del carrito
    function openCartModal() {
      renderizarModalCarrito(); // Dibuja productos agregados
      document.getElementById("cart-modal").classList.add("active"); // Muestra la ventana
    }

    // Cierra la ventana modal del carrito
    function closeCartModal() {
      document.getElementById("cart-modal").classList.remove("active"); // Oculta la ventana
    }

    // Dibuja el listado de productos y los totales en el modal del carrito
    function renderizarModalCarrito() {
      const contenedor = document.getElementById("cart-items-container");

      // Si el carrito está vacío
      if (carrito.length === 0) {
        contenedor.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px;">Tu carrito está vacío.</p>`;
        document.getElementById("summary-total-ref").textContent = `${MI_CONFIGURACION.simboloMoneda}0.00`;
        document.getElementById("summary-total-bs").textContent = "Bs. 0,00";
        return;
      }

      let totalRef = 0; // Acumulador del costo de referencia

      // Dibuja cada producto con sus botones para sumar o restar
      contenedor.innerHTML = carrito.map(item => {
        const subtotalRef = item.priceRef * item.qty;
        totalRef += subtotalRef;
        const subtotalBs = (subtotalRef * MI_CONFIGURACION.tasaBCV).toFixed(2);
        return `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-sub">${item.qty} x ${MI_CONFIGURACION.simboloMoneda}${item.priceRef.toFixed(2)} = ${MI_CONFIGURACION.simboloMoneda}${subtotalRef.toFixed(2)} (Bs. ${subtotalBs})</div>
            </div>
            <div class="cart-qty-controls">
              <button class="btn-qty" onclick="cambiarCantidadCarrito('${item.cartId || item.id}', -1)">-</button>
              <span style="font-weight:700; color:var(--text-color);">${item.qty}</span>
              <button class="btn-qty" onclick="cambiarCantidadCarrito('${item.cartId || item.id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      // Cálculo del monto total en Bolívares
      const totalBs = (totalRef * MI_CONFIGURACION.tasaBCV).toFixed(2);
      // Muestra los totales en pantalla
      document.getElementById("summary-total-ref").textContent = `${MI_CONFIGURACION.simboloMoneda}${totalRef.toFixed(2)}`;
      document.getElementById("summary-total-bs").textContent = `Bs. ${totalBs}`;
    }

    // Enviar el pedido estructurado hacia el WhatsApp del negocio
    function sendOrderToWhatsApp() {
      // Valida que existan productos en el carrito
      if (carrito.length === 0) {
        alert("El carrito está vacío. Agrega productos antes de enviar tu pedido.");
        return;
      }

      // Valida que el cliente coloque su nombre
      const nombreCliente = document.getElementById("order-customer-name").value.trim();
      if (!nombreCliente) {
        alert("Por favor escribe tu nombre para el pedido.");
        return;
      }

      // Recolección de los datos de despacho y pago
      const tipoEntrega = document.getElementById("order-delivery-type").value;
      const direccion = document.getElementById("order-customer-address").value.trim();
      const formaPago = document.getElementById("order-payment-method").value;
      const notas = document.getElementById("order-notes").value.trim();

      // Prepara los detalles de cada producto para la plantilla
      let totalRef = 0;
      const itemsProcesados = carrito.map(item => {
        const subtotal = item.priceRef * item.qty;
        totalRef += subtotal;
        const subtotalBs = (subtotal * MI_CONFIGURACION.tasaBCV).toFixed(2);
        return {
          name: item.name,
          qty: item.qty,
          subtotalRef: subtotal,
          subtotalBs: subtotalBs
        };
      });

      const totalBs = (totalRef * MI_CONFIGURACION.tasaBCV).toFixed(2);

      // Objeto con todos los datos del pedido
      const datosPedido = {
        nombreCliente,
        tipoEntrega,
        direccion,
        formaPago,
        notas,
        items: itemsProcesados,
        totalRef,
        totalBs
      };

      // Construye el mensaje personalizado llamando a la función de la SECCION 3
      const mensajeTexto = construirMensajeWhatsApp(datosPedido);

      // Limpia caracteres no numéricos del número configurado
      const telefonoLimpio = MI_CONFIGURACION.telefonoWhatsApp.replace(/\D/g, "");

      // Genera el enlace de la API de WhatsApp con el mensaje codificado
      const urlWhatsApp = `https://wa.me/${telefonoLimpio}?text=${encodeURIComponent(mensajeTexto)}`;

      // Abre la conversación de WhatsApp en una pestaña nueva
      window.open(urlWhatsApp, "_blank");
    }

    // =========================================================================
    // SECCION 5: CONSULTA AUTOMATICA DE LA TASA OFICIAL DEL EURO BCV
    // =========================================================================
    // Consulta la API pública y segura para obtener la tasa del Euro BCV actualizada al día
    async function consultarTasaEuroBCV() {
      // 1. Intenta recuperar la última tasa exitosa guardada en la memoria local del navegador (localStorage)
      const tasaMemoria = localStorage.getItem("cookies360_ultima_tasa_euro_bcv");
      // Si existe una tasa guardada previamente en memoria, se adopta como nuevo respaldo dinámico
      if (tasaMemoria && !isNaN(parseFloat(tasaMemoria))) {
        // Reemplaza la tasa base por la última registrada en la visita anterior
        MI_CONFIGURACION.tasaBCV = parseFloat(tasaMemoria);
      }
      // Si la opción automática está desactivada, conserva la tasa obtenida
      if (!MI_CONFIGURACION.usarApiAutomaticaBCV) return;
      try {
        // Realiza la petición asíncrona a la API del Euro BCV
        const peticion = await fetch(MI_CONFIGURACION.urlApiEuroBCV);
        // Verifica si la respuesta del servidor es satisfactoria (código HTTP 200)
        if (peticion.ok) {
          // Decodifica la respuesta en formato JSON
          const respuestaJSON = await peticion.json();
          // Valida que el campo 'promedio' contenga un número válido mayor a cero
          if (respuestaJSON && respuestaJSON.promedio && !isNaN(respuestaJSON.promedio)) {
            // Actualiza la variable tasaBCV en memoria con la tasa oficial del día
            MI_CONFIGURACION.tasaBCV = parseFloat(respuestaJSON.promedio);
            // Guarda esta nueva tasa en localStorage para que sea el nuevo respaldo permanente
            localStorage.setItem("cookies360_ultima_tasa_euro_bcv", MI_CONFIGURACION.tasaBCV.toString());
            // Imprime en la consola para comprobación técnica
            console.log("Tasa Euro BCV actualizada y guardada en memoria local: Bs. " + MI_CONFIGURACION.tasaBCV.toFixed(2));
            // Redibuja los productos para refrescar de inmediato los precios en Bolívares
            renderizarProductos();
            // Si la ventana del carrito está abierta, recalcula los totales al momento
            if (document.getElementById("cart-modal").classList.contains("active")) {
              renderizarModalCarrito();
            }
          }
        }
      } catch (error) {
        // En caso de que no haya conexión a internet, se mantiene la última tasa registrada
        console.warn("Aviso: No se pudo conectar a la API del Euro BCV. Se mantiene la última tasa registrada: Bs. " + MI_CONFIGURACION.tasaBCV, error);
      }
    }

    // =========================================================================
    // SECCION 6: INICIALIZACION AUTOMATICA AL CARGAR LA PAGINA
    // =========================================================================
    window.addEventListener("DOMContentLoaded", () => {
      aplicarConfiguracionVisual(); // Aplica colores de la paleta, logo, banner y textos
      renderizarCategorias(); // Dibuja los botones de categorías
      renderizarProductos(); // Dibuja el catálogo de productos con la tasa inicial
      actualizarContadorCarrito(); // Inicializa el contador del carrito
      consultarTasaEuroBCV(); // Consulta y sincroniza la tasa oficial del Euro BCV en tiempo real
    });
  </script>
